
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>GoJak TechOps</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    .header {
      background: #0f172a;
      color: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #cbd5e1;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .status {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      margin: 16px 0;
    }

    .success {
      color: #15803d;
      background: #dcfce7;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
  </style>

  <script src="./api.js"></script>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>GoJak TechOps</h1>
      <p>IT Asset Management System</p>
    </header>

    <section class="card">
      <h2>Koneksi Backend</h2>

      <div id="status" class="status">
        Menunggu pengujian API...
      </div>

      <button id="testButton" onclick="testAPI()">
        Uji Koneksi API
      </button>

      <div id="result"></div>
    </section>

  </main>

  <script>
    async function testAPI() {
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const button = document.getElementById("testButton");

      button.disabled = true;
      status.className = "status";
      status.textContent = "Menghubungi backend...";
      result.textContent = "";

      try {
        const response = await TechOpsAPI.get("computers.list");

        if (Array.isArray(response)) {
          status.className = "status success";
          status.textContent = "Koneksi API berhasil.";

          result.textContent =
            "Total komputer berhasil dibaca: " + response.length;
        } else if (response && response.success === false) {
          throw new Error(response.message || "API mengembalikan kesalahan.");
        } else {
          throw new Error("Format respons API tidak sesuai.");
        }

      } catch (error) {
        status.className = "status error";
        status.textContent = "Koneksi API gagal: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
