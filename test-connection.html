
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoJak TechOps - JSONP Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 35px auto;
      padding: 20px;
      color: #202124;
      background: #f8fafc;
    }
    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }
    button {
      padding: 11px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      background: #1769aa;
      color: white;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #status {
      font-weight: bold;
      margin-top: 18px;
    }
    pre {
      background: #f1f3f4;
      border-radius: 8px;
      padding: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>GoJak TechOps — JSONP Connection Test</h2>
    <p>
      Menguji komunikasi GitHub Pages dengan Apps Script
      tanpa popup dan tanpa postMessage.
    </p>

    <button id="btnPing" onclick="runTest('ping')">
      Tes Ping
    </button>

    <button id="btnRead" onclick="runTest('public-read')">
      Tes Baca Komputer
    </button>
<button onclick="runTest('admin-protection')">
  Tes Proteksi Admin
</button>
    <button onclick="runTest('admin-write-denied')">
  Tes Penolakan Perubahan Data
</button>
    <button onclick="runPostTest()">
  Tes POST Backend
</button>
    <p id="status">Belum ada pengujian.</p>
    <h3>Hasil Pengujian</h3>
    <pre id="result">Menunggu pengujian.</pre>
  </div>

  <script>
    const API_TEST_URL =
      "https://script.google.com/macros/s/AKfycbzZDgkgWTr6_JUY9pBgr6RFtm41DKA3C7bazuTNw26IVBNEpgrN72IpawsIE74HV2MK/exec";

    let activeScript = null;
    let requestNumber = 0;
    let requestTimer = null;

    function setButtonsDisabled(disabled) {
      document.getElementById("btnPing").disabled = disabled;
      document.getElementById("btnRead").disabled = disabled;
    }

    function showResult(status, data) {
      document.getElementById("status").textContent = status;
      document.getElementById("result").textContent =
        JSON.stringify(data, null, 2);
    }

    // Callback global yang dipanggil oleh respons JSONP Apps Script.
    window.GoJakTestCallback = function(data) {
      clearTimeout(requestTimer);

      if (activeScript) {
        activeScript.remove();
        activeScript = null;
      }

      setButtonsDisabled(false);

      showResult(
        data && data.success
          ? "KOMUNIKASI BERHASIL"
          : "RESPONS DITERIMA, TETAPI TES GAGAL",
        data
      );
    };

    function runTest(action) {
      if (activeScript) {
        activeScript.remove();
        activeScript = null;
      }

      clearTimeout(requestTimer);
      requestNumber++;

      setButtonsDisabled(true);

      document.getElementById("status").textContent =
        "Menghubungi Apps Script: " + action;

      document.getElementById("result").textContent =
        "Menunggu respons...";

      const url = API_TEST_URL +
        "?page=api-test-jsonp" +
        "&action=" + encodeURIComponent(action) +
        "&callback=GoJakTestCallback" +
        "&_=" + Date.now() + "-" + requestNumber;

      const script = document.createElement("script");
      activeScript = script;

      script.src = url;
      script.async = true;

      script.onerror = function() {
        clearTimeout(requestTimer);
        setButtonsDisabled(false);
        activeScript = null;

        showResult("GAGAL MEMUAT RESPONS JSONP", {
          action: action,
          message:
            "Browser tidak dapat memuat respons Apps Script. " +
            "Periksa deployment dan URL endpoint."
        });
      };

      requestTimer = setTimeout(function() {
        if (activeScript === script) {
          script.remove();
          activeScript = null;
          setButtonsDisabled(false);

          showResult("TIMEOUT", {
            action: action,
            message: "Tidak ada respons dalam 20 detik."
          });
        }
      }, 20000);

      document.head.appendChild(script);
    }
    function runPostTest() {
  const form = document.createElement("form");

  form.method = "POST";
  form.action = API_TEST_URL;
  form.target = "_blank";

  const token = document.createElement("input");
  token.type = "hidden";
  token.name = "testToken";
  token.value = "GOJAK_POST_TEST_2026";

  form.appendChild(token);
  document.body.appendChild(form);

  form.submit();
  form.remove();
}
  </script>
</body>
</html>
